[package]
name = "security-vault-lab"
version = "0.1.0"
edition = "2021"
rust-version = "1.79"
[lib]
crate-type = ["cdylib", "lib"]
name = "security_vault_lab"
[features]
default = []
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
[dependencies]
anchor-lang = "=0.31.1"
anchor-spl = { version = "=0.31.1", features = ["token"] }
[workspace]
[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
